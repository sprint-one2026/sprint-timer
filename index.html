
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1">
<title>短距離タイマー</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #10141c;
  color: white;
  font-family: sans-serif;
}
header, footer {
  background: #202938;
  padding: 8px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
button {
  background: #287deb;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px;
  font-size: 15px;
}
input {
  width: 65px;
  padding: 6px;
  font-size: 16px;
}
#stage {
  position: relative;
  height: 65vh;
  min-height: 180px;
  background: black;
  overflow: hidden;
  touch-action: none;
}
video, canvas {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: fill;
}
#overlay { pointer-events: none; }
#result {
  font-size: 26px;
  color: #ffdd70;
  font-weight: bold;
}
#status { font-size: 14px; }
small { color: #ddd; }
</style>
</head>

<body>
<header>
  <button id="camera">カメラ開始</button>
  <button id="arm">測定準備</button>
  <button id="reset">リセット</button>

  <label>距離
    <input id="distance" type="number"
      value="30" min="0.1" step="0.1">m
  </label>

  <label>読み上げ
    <input id="delay" type="number"
      value="3" min="0" max="60" step="0.5">秒後
  </label>

  <span id="status">カメラ未開始</span>
</header>

<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
</div>

<footer>
  <span id="result">--.-- 秒</span>
  <small>
    赤線＝スタート / 緑線＝ゴール。
    線は指で左右に動かせます。
  </small>
</footer>

<script>
const video = document.getElementById("video");
const stage = document.getElementById("stage");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const result = document.getElementById("result");

let stream = null;
let audio = null;
let armed = false;
let phase = 0;
let startTime = 0;
let previous = null;
let hitStart = 0;
let hitGoal = 0;
let announceTimer = null;
let running = false;

let lines = [0.28, 0.72];
let drag = -1;

const W = 320;
const H = 180;
const off = document.createElement("canvas");
off.width = W;
off.height = H;
const oc = off.getContext("2d", {
  willReadFrequently: true
});

function setStatus(text) {
  statusEl.textContent = text;
}

// 通過時の電子音
function beep(freq = 950) {
  if (!audio) return;

  const o = audio.createOscillator();
  const g = audio.createGain();

  o.type = "sine";
  o.frequency.value = freq;

  g.gain.setValueAtTime(
    0.001, audio.currentTime
  );
  g.gain.exponentialRampToValueAtTime(
    0.25, audio.currentTime + 0.01
  );
  g.gain.exponentialRampToValueAtTime(
    0.001, audio.currentTime + 0.15
  );

  o.connect(g);
  g.connect(audio.destination);
  o.start();
  o.stop(audio.currentTime + 0.16);
}

// 測定タイムを日本語で読み上げる
function speak(seconds) {
  if (!("speechSynthesis" in window)) return;

  const parts = seconds.toFixed(2).split(".");
  const message = parts[0] + "秒" + parts[1];

  const utterance =
    new SpeechSynthesisUtterance(message);

  utterance.lang = "ja-JP";
  utterance.rate = 0.9;
  utterance.volume = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}

// 画面サイズ
function resize() {
  canvas.width = stage.clientWidth *
    devicePixelRatio;
  canvas.height = stage.clientHeight *
    devicePixelRatio;
}
window.addEventListener("resize", resize);
resize();

// 2本の線を表示
function draw() {
  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);

  lines.forEach((x, i) => {
    const px = x * w;

    ctx.strokeStyle =
      i === 0 ? "#ff4444" : "#33ff77";
    ctx.lineWidth = 4 * devicePixelRatio;

    ctx.beginPath();
    ctx.moveTo(px, 0);
    ctx.lineTo(px, h);
    ctx.stroke();

    ctx.fillStyle = ctx.strokeStyle;
    ctx.font =
      (15 * devicePixelRatio) + "px sans-serif";

    ctx.fillText(
      i === 0 ? "スタート" : "ゴール",
      px + 5,
      25 * devicePixelRatio
    );
  });

  requestAnimationFrame(draw);
}
draw();

// 線を指で移動
stage.addEventListener("pointerdown", e => {
  const rect = stage.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;

  drag = Math.abs(lines[0] - x) <
    Math.abs(lines[1] - x) ? 0 : 1;

  stage.setPointerCapture(e.pointerId);
});

stage.addEventListener("pointermove", e => {
  if (drag < 0) return;

  const rect = stage.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;

  lines[drag] = Math.max(
    0.04, Math.min(0.96, x)
  );
  previous = null;
});

stage.addEventListener("pointerup", () => {
  drag = -1;
});
stage.addEventListener("pointercancel", () => {
  drag = -1;
});

// カメラ開始
document.getElementById("camera").onclick =
async () => {
  try {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }

    stream = await navigator.mediaDevices
      .getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 },
          frameRate: { ideal: 60 }
        }
      });

    video.srcObject = stream;
    await video.play();

    setStatus("カメラ起動・測定準備を押す");
    previous = null;

    if (!running) {
      running = true;
      requestAnimationFrame(detect);
    }
  } catch (e) {
    setStatus("カメラの許可を確認してください");
  }
};

// 測定準備
document.getElementById("arm").onclick =
async () => {
  audio = audio || new (
    window.AudioContext ||
    window.webkitAudioContext
  )();

  await audio.resume();

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
    const u =
      new SpeechSynthesisUtterance("準備完了");
    u.lang = "ja-JP";
    speechSynthesis.speak(u);
  }

  clearTimeout(announceTimer);

  phase = 0;
  armed = true;
  previous = null;
  hitStart = 0;
  hitGoal = 0;

  result.textContent = "--.-- 秒";
  setStatus("スタート待機中");
};

// リセット
document.getElementById("reset").onclick =
() => {
  armed = false;
  phase = 0;
  previous = null;
  clearTimeout(announceTimer);
  speechSynthesis.cancel();

  result.textContent = "--.-- 秒";
  setStatus("リセットしました");
};

// 線付近の映像変化を検知
function stripMotion(curr, prev, x) {
  const xx = Math.max(
    3, Math.min(W - 4, Math.round(x * W))
  );

  let changed = 0;
  let total = 0;

  for (let y = 25; y < H - 15; y += 3) {
    for (let dx = -3; dx <= 3; dx += 2) {
      const p = (y * W + xx + dx) * 4;

      const diff = (
        Math.abs(curr[p] - prev[p]) +
        Math.abs(curr[p+1] - prev[p+1]) +
        Math.abs(curr[p+2] - prev[p+2])
      ) / 3;

      if (diff > 32) changed++;
      total++;
    }
  }

  return changed / total;
}

// 自動計測
function detect() {
  if (video.readyState >= 2) {
    oc.drawImage(video, 0, 0, W, H);
    const data =
      oc.getImageData(0, 0, W, H).data;

    if (previous && armed &&
        lines[0] < lines[1]) {

      const s = stripMotion(
        data, previous, lines[0]
      );
      const g = stripMotion(
        data, previous, lines[1]
      );

      // スタート線通過
      if (phase === 0) {
        hitStart = s > 0.14 ?
          hitStart + 1 : 0;

        if (hitStart >= 2) {
          phase = 1;
          startTime = performance.now();

          beep(950);
          setStatus("計測中...");
          hitGoal = 0;
        }
      }

      // ゴール線通過
      else if (phase === 1) {
        hitGoal = g > 0.14 ?
          hitGoal + 1 : 0;

        if (hitGoal >= 2) {
          const elapsed =
            (performance.now() - startTime) / 1000;

          phase = 2;
          armed = false;

          beep(1250);

          result.textContent =
            elapsed.toFixed(2) + " 秒";

          setStatus("測定完了");

          // ゴール3秒後に読み上げ
          const delay = Math.max(
            0,
            Math.min(
              60,
              Number(
                document.getElementById("delay").value
              ) || 0
            )
          );

          announceTimer = setTimeout(() => {
            speak(elapsed);
          }, delay * 1000);
        }
      }
    }

    previous = new Uint8ClampedArray(data);
  }

  requestAnimationFrame(detect);
}
</script>
</body>
</html>
