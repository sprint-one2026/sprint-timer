
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>短距離タイマー</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#111827;color:white;
 font-family:-apple-system,sans-serif;
}
.toolbar{
 display:flex;align-items:center;gap:8px;
 padding:9px;flex-wrap:wrap;background:#202b3d;
}
button{
 background:#2678e9;border:0;color:white;
 border-radius:8px;padding:10px;font-size:15px;
}
input{
 width:66px;padding:7px;border-radius:6px;
 border:0;font-size:16px;
}
.stage{
 position:relative;width:100%;
 height:calc(100dvh - 110px);
 min-height:230px;background:#090d13;
 overflow:hidden;
}
video,canvas{
 position:absolute;width:100%;height:100%;
 inset:0;
}
video{object-fit:contain}
canvas{touch-action:none}
.readout{
 position:absolute;top:12px;left:50%;
 transform:translateX(-50%);
 padding:8px 22px;
 background:rgba(0,0,0,.73);
 border-radius:12px;text-align:center;
 pointer-events:none;min-width:180px;
}
.time{
 font-size:clamp(34px,7vw,66px);
 font-weight:800;
 font-variant-numeric:tabular-nums;
}
.status{font-size:13px;color:#d1d5db}
.hint{font-size:12px;padding:5px 10px;color:#cbd5e1}
</style>
</head>
<body>

<div class="toolbar">
 <button id="camera">カメラ開始</button>
 <button id="arm">測定準備・音声ON</button>
 <button id="reset">リセット</button>
 <label>距離
  <input id="distance" type="number" value="30" min="1">m
 </label>
 <label>読み上げ
  <input id="delay" type="number" value="3" min="0" step="0.5">秒後
 </label>
</div>

<div class="stage" id="stage">
 <video id="video" autoplay muted playsinline></video>
 <canvas id="overlay"></canvas>
 <div class="readout">
  <div id="time" class="time">0.00</div>
  <div id="status" class="status">カメラを開始してください</div>
 </div>
</div>

<div class="hint">
 線を左右にドラッグして位置調整。
 選手は左から右へ走ります。
 測定前に「測定準備・音声ON」を押してください。
</div>

<script>
const video=document.getElementById('video');
const canvas=document.getElementById('overlay');
const ctx=canvas.getContext('2d');
const stage=document.getElementById('stage');
const timeEl=document.getElementById('time');
const statusEl=document.getElementById('status');

let startX=.27;
let goalX=.77;
let drag=null;
let armed=false;
let running=false;
let finished=false;
let startAt=0;
let elapsed=0;
let raf=0;
let readTimer=null;
let audio=null;
let stream=null;

const setStatus=s=>statusEl.textContent=s;

function resize(){
 canvas.width=stage.clientWidth*devicePixelRatio;
 canvas.height=stage.clientHeight*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener('resize',resize);
resize();

function tone(freq=950){
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume();
  const o=audio.createOscillator();
  const g=audio.createGain();
  const t=audio.currentTime;
  o.frequency.value=freq;
  g.gain.setValueAtTime(.12,t);
  g.gain.exponentialRampToValueAtTime(.001,t+.12);
  o.connect(g);
  g.connect(audio.destination);
  o.start(t);
  o.stop(t+.13);
 }catch(e){console.warn(e)}
}

function prepareAudio(){
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  audio.resume();
  tone(700);
 }catch(e){}
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance('音声準備完了');
  u.lang='ja-JP';
  u.rate=1;
  u.volume=1;
  speechSynthesis.speak(u);
 }catch(e){
  setStatus('音声を許可してください');
 }
}

function speakResult(sec){
 const words='タイムは、'+sec.toFixed(2).replace('.','てん')+'秒です';
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(words);
  u.lang='ja-JP';
  u.rate=.9;
  u.volume=1;
  u.onerror=()=>{
   setStatus('音声が再生できません。音量を確認してください');
  };
  speechSynthesis.speak(u);
 }catch(e){
  setStatus('読み上げに失敗しました');
 }
}

function reset(){
 clearTimeout(readTimer);
 armed=false;
 running=false;
 finished=false;
 elapsed=0;
 previous=null;
 prevStart=0;
 prevGoal=0;
 timeEl.textContent='0.00';
 setStatus('測定準備を押してください');
}

document.getElementById('reset').onclick=reset;

document.getElementById('camera').onclick=async()=>{
 try{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:'environment',
    width:{ideal:1280},
    height:{ideal:720},
    frameRate:{ideal:60}
   }
  });
  video.srcObject=stream;
  await video.play();
  setStatus('カメラ起動完了');
  cancelAnimationFrame(raf);
  loop();
 }catch(e){
  setStatus('カメラを許可し、HTTPSで開いてください');
 }
};

document.getElementById('arm').onclick=()=>{
 reset();
 armed=true;
 prepareAudio();
 setStatus('待機中：赤線の通過を検知します');
};

canvas.addEventListener('pointerdown',e=>{
 const r=canvas.getBoundingClientRect();
 const x=(e.clientX-r.left)/r.width;
 drag=Math.abs(x-startX)<Math.abs(x-goalX)?'start':'goal';
 canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove',e=>{
 if(!drag)return;
 const r=canvas.getBoundingClientRect();
 const x=Math.max(.03,Math.min(.97,(e.clientX-r.left)/r.width));
 if(drag==='start')startX=Math.min(x,goalX-.05);
 else goalX=Math.max(x,startX+.05);
});

canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('pointercancel',()=>drag=null);

const work=document.createElement('canvas');
work.width=160;
work.height=90;
const wctx=work.getContext('2d',{willReadFrequently:true});
let previous=null;
let prevStart=0;
let prevGoal=0;
let lastTrigger=0;

function motion(){
 if(video.readyState<2)return;
 wctx.drawImage(video,0,0,160,90);
 let data;
 try{
  data=wctx.getImageData(0,0,160,90).data;
 }catch(e){return}

 if(!previous){
  previous=new Uint8ClampedArray(data);
  return;
 }

 const scores=[0,0];
 const lines=[startX,goalX];

 for(let k=0;k<2;k++){
  let cx=Math.round(lines[k]*159);
  let sum=0,n=0;
  for(let y=16;y<85;y+=3){
   for(let x=Math.max(1,cx-2);x<=Math.min(158,cx+2);x+=2){
    const i=(y*160+x)*4;
    sum+=(
     Math.abs(data[i]-previous[i])+
     Math.abs(data[i+1]-previous[i+1])+
     Math.abs(data[i+2]-previous[i+2])
    )/3;
    n++;
   }
  }
  scores[k]=sum/Math.max(1,n);
 }

 previous=new Uint8ClampedArray(data);
 const now=performance.now();
 const threshold=24;

 if(armed&&!running&&!finished&&
    scores[0]>threshold&&prevStart<=threshold&&
    now-lastTrigger>500){
  running=true;
  startAt=now;
  lastTrigger=now;
  tone();
  setStatus('計測中');
 }
 else if(running&&scores[1]>threshold&&
         prevGoal<=threshold&&now-startAt>250){
  elapsed=(now-startAt)/1000;
  running=false;
  finished=true;
  armed=false;
  tone(1100);
  timeEl.textContent=elapsed.toFixed(2);
  setStatus('ゴール！ 読み上げ待機中');

  const wait=Math.max(
   0,Number(document.getElementById('delay').value)||0
  )*1000;

  readTimer=setTimeout(()=>{
   setStatus('測定完了');
   speakResult(elapsed);
  },wait);
 }
 prevStart=scores[0];
 prevGoal=scores[1];
}

function loop(){
 const w=stage.clientWidth;
 const h=stage.clientHeight;
 ctx.clearRect(0,0,w,h);
 motion();

 if(running){
  timeEl.textContent=((performance.now()-startAt)/1000).toFixed(2);
 }

 for(const [x,color,name] of [
  [startX,'#ff3c4d','スタート'],
  [goalX,'#00ff8a','ゴール']
 ]){
  ctx.strokeStyle=color;
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(x*w,0);
  ctx.lineTo(x*w,h);
  ctx.stroke();
  ctx.font='18px sans-serif';
  ctx.fillStyle=color;
  ctx.fillText(name,Math.min(w-95,x*w+7),28);
 }
 raf=requestAnimationFrame(loop);
}
</script>
</body>
</html>
